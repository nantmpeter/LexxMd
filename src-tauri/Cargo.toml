[package]
name = "lexx"
version = "0.1.0"
edition = "2021"

[features]
# Opt-in webview devtools. Off by default: tauri gates the inspector behind
# `cfg(any(debug_assertions, feature = "devtools"))`, so release builds
# compile it out entirely unless this feature is enabled.
devtools = ["tauri/devtools"]

[lib]
name = "lexx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Keep: tauri::generate_context! expands to code that names `serde_json`,
# so it must stay a direct dependency even though no source file imports it.
serde_json = "1"
base64 = "0.22"
urlencoding = "2.1"
tauri-plugin-process = "2.3.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"
tauri-plugin-single-instance = "2"
